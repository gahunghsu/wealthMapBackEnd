spring.application.name=wealthmap
server.port=${PORT:8080}

# Database Configuration (Railway Environment Variables)
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.writetimeout=5000

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.example.dynamicsurvey=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security / JWT Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# API Keys
gnews.api.key=${GNEWS_API_KEY}
finmind.api.token=${FINMIND_API_TOKEN}

